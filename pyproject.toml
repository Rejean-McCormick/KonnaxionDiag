[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konnaxiondiag"
version = "4.0.0"
description = "Unified Konnaxion functional and security diagnostics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=41"]
test = ["pytest>=7"]

[project.scripts]
kdiag = "diagcore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diagcore*", "profiles*"]
